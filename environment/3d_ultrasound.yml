# 3d_ultrasound — Reconstruction and figures; no hardware, no detector.
# Recreate with:  conda env create -f environment/3d_ultrasound.yml

name: 3d_ultrasound
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
    - PySide6==6.9.2
    - matplotlib==3.10.6
    - nibabel==5.3.2
    - numpy==2.2.6
    - opencv-python==4.12.0.88
    - pillow==11.3.0
    - plotly==6.5.0
    - scikit-learn==1.9.0
    - scipy==1.16.2
